<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>照片工坊</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #262626;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #photocraft_canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; outline: none; touch-action: none;
    }
    #pc_splash {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #23262b;
      color: #cfd3d8;
      font: 14px "HarmonyOS Sans SC", -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    #pc_splash.pc-hidden { display: none; }
    #pc_splash .pc-logo {
      width: 72px; height: 72px; border-radius: 18px; margin-bottom: 22px;
      background: linear-gradient(135deg, #1c3f8f 0%, #2f7bf5 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(47, 123, 245, .28);
    }
    #pc_splash .pc-logo svg { width: 44px; height: 44px; }
    #pc_bar { width: 248px; height: 4px; border-radius: 2px; background: #3a3f47; overflow: hidden; margin-top: 18px; }
    #pc_bar > i { display: block; height: 100%; width: 0%; background: #4c8dff; transition: width .16s ease; }
    #pc_tip { margin-top: 12px; font-size: 12px; color: #7d848d; }
    #pc_err {
      position: absolute; inset: 0; z-index: 20; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; background: #1f2226; color: #e6e8eb; text-align: center;
      font: 14px "HarmonyOS Sans SC", -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    #pc_err.pc-show { display: flex; }
    #pc_err h2 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
    #pc_err p { font-size: 13px; color: #9aa0a6; margin: 0 0 14px; max-width: 520px; line-height: 1.6; }
    #pc_err pre {
      max-width: 90%; max-height: 34%; overflow: auto; margin: 0 0 18px;
      padding: 12px 14px; border-radius: 10px; background: #2a2e34; color: #b9bfc7;
      font-size: 12px; text-align: left; white-space: pre-wrap; word-break: break-all;
    }
    #pc_err button {
      padding: 9px 26px; border-radius: 20px; cursor: pointer;
      border: 1px solid #4c8dff; background: rgba(76, 141, 255, .12); color: #8ab4ff; font-size: 14px;
    }
  </style>
</head>
<body>
  <canvas id="photocraft_canvas" tabindex="0"></canvas>

  <div id="pc_splash">
    <div class="pc-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2.5" y="4.5" width="19" height="15" rx="2.6" stroke="#fff" stroke-width="1.9"/>
        <circle cx="8.4" cy="9.6" r="1.9" fill="#fff"/>
        <path d="M4.6 17.4l5.1-5.6 3.3 3.5 2.2-2.3 4.2 4.4" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div id="pc_splash_text">正在启动照片工坊…</div>
    <div id="pc_bar"><i id="pc_bar_fill"></i></div>
    <div id="pc_tip">首次启动需编译约 24.5&nbsp;MB 图像引擎，请稍候</div>
  </div>

  <div id="pc_err">
    <h2>图像引擎启动失败</h2>
    <p id="pc_err_msg">编辑引擎未能初始化，请点击下方按钮重试。若问题持续存在，可在左侧设置中切换渲染后端。</p>
    <pre id="pc_err_detail"></pre>
    <button onclick="location.reload()">重新加载</button>
  </div>

  <script>
  (function () {
    'use strict';

    // 引擎胶水层有两个版本：
    //   * .classic.js —— 由 ESM 等价转换而来的经典脚本版（默认走这条，兼容性最好）
    //   * .js         —— 上游原始 ESM（仅在经典脚本通道失败时回退尝试）
    var JS_CLASSIC_URL = './photocraft-web-zh.classic.js';
    var JS_MODULE_URL = './photocraft-web-zh.js';
    var WASM_URL = './photocraft-web-zh_bg.wasm';
    var CHUNK_SIZE = 1 << 20; // 1 MiB

    var splash = document.getElementById('pc_splash');
    var splashText = document.getElementById('pc_splash_text');
    var barFill = document.getElementById('pc_bar_fill');
    var errBox = document.getElementById('pc_err');
    var errMsg = document.getElementById('pc_err_msg');
    var errDetail = document.getElementById('pc_err_detail');

    function bridge() {
      try { return window.pcBridge || null; } catch (e) { return null; }
    }

    function report(state, message) {
      try {
        var b = bridge();
        if (b && typeof b.reportState === 'function') {
          b.reportState(String(state), String(message || ''));
        }
      } catch (e) { /* ignore */ }
    }

    // 页面日志：同时进 DevEco 的 hilog（经原生桥）和 Web 控制台，方便定位卡在哪一步
    function plog(message) {
      try { console.info('[PhotoCraft] ' + message); } catch (e) { /* ignore */ }
      try {
        var b = bridge();
        if (b && typeof b.log === 'function') { b.log(String(message)); }
      } catch (e) { /* ignore */ }
    }

    // 引擎（Rust/wasm）的日志只写到 Web 控制台，真机上不方便看。把其中几条关键的
    // —— 实际渲染后端、GPU 画布参数、panic/设备丢失 —— 一并转给原生侧写进 hilog，
    // 这样在 DevEco 的 Log 面板搜 [PhotoCraft] 就能确认跑的是 WebGL2 还是 WebGPU。
    (function () {
      var key = /wgpu backend|gpu canvas|panicked|device lost|Uncaught|Failed to/i;
      ['info', 'warn', 'error'].forEach(function (level) {
        var orig = console[level];
        if (typeof orig !== 'function') { return; }
        console[level] = function () {
          try {
            var parts = [];
            for (var i = 0; i < arguments.length; i++) {
              var a = arguments[i];
              parts.push(typeof a === 'string' ? a : (a && a.message) ? String(a.message) : String(a));
            }
            var line = parts.join(' ');
            if (key.test(line) && line.indexOf('[PhotoCraft]') !== 0) {
              plog('引擎: ' + line);
            }
          } catch (e) { /* ignore */ }
          return orig.apply(console, arguments);
        };
      });
    })();

    // ------------------------------------------------------------------
    // 保存 / 导出 接管
    //
    // 引擎的「保存」「另存为」「导出」最后都是同一个动作：把字节打成 Blob，
    // 造一个隐藏的 <a download> 然后 click()。桌面浏览器会弹下载，鸿蒙的
    // Web 组件不会 —— 点了没反应、也不知道存到哪去了。这里把那次 click 拦下来，
    // 把字节分块交给原生，由系统文件选择器写到用户自己选的目录。
    // ------------------------------------------------------------------
    var SAVE_CHUNK = 256 * 1024; // 每块 256 KiB，base64 后约 350 KB
    var pcBlobs = {};            // blob: URL -> Blob

    (function hookObjectUrl() {
      try {
        var origCreate = URL.createObjectURL.bind(URL);
        URL.createObjectURL = function (obj) {
          var u = origCreate(obj);
          try {
            if (obj && typeof Blob !== 'undefined' && obj instanceof Blob) { pcBlobs[u] = obj; }
          } catch (e) { /* ignore */ }
          return u;
        };
        var origRevoke = URL.revokeObjectURL.bind(URL);
        URL.revokeObjectURL = function (u) {
          try { delete pcBlobs[u]; } catch (e) { /* ignore */ }
          return origRevoke(u);
        };
      } catch (e) { /* ignore */ }
    })();

    function pcToBase64(bytes) {
      var out = '';
      var step = 8192;
      for (var i = 0; i < bytes.length; i += step) {
        out += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + step, bytes.length)));
      }
      try { return btoa(out); } catch (e) { return ''; }
    }

    function pcSendBytes(handle, bytes) {
      var ok = true;
      try {
        for (var off = 0; off < bytes.length; off += SAVE_CHUNK) {
          var b64 = pcToBase64(bytes.subarray(off, Math.min(off + SAVE_CHUNK, bytes.length)));
          if (!b64 || handle.saveChunk(b64) !== true) { ok = false; break; }
        }
      } catch (e) {
        ok = false;
        plog('保存分块传输异常: ' + e);
      }
      try { handle.finishSave(ok ? bytes.length : -1); } catch (e) { /* ignore */ }
    }

    /** 把一次下载交给宿主。返回 true 表示已接管（不要再走浏览器下载）。 */
    function pcHostSave(name, blob, url) {
      var b = bridge();
      if (!b || typeof b.beginSave !== 'function' || typeof b.saveChunk !== 'function' ||
          typeof b.finishSave !== 'function') {
        return false;
      }
      if (!name) { name = 'photocraft-export'; }
      var started = false;
      try {
        started = b.beginSave(String(name), (blob && blob.type) ? String(blob.type) : '',
          (blob && blob.size) ? blob.size : 0) === true;
      } catch (e) {
        plog('beginSave 失败: ' + e);
      }
      if (!started) { return false; }
      plog('导出交给宿主: ' + name);

      if (blob && typeof blob.arrayBuffer === 'function') {
        blob.arrayBuffer().then(function (buf) {
          pcSendBytes(b, new Uint8Array(buf));
        }).catch(function (e) {
          plog('读取导出数据失败: ' + e);
          try { b.finishSave(-1); } catch (e2) { /* ignore */ }
        });
        return true;
      }
      if (url) {
        fetch(url).then(function (res) { return res.arrayBuffer(); }).then(function (buf) {
          pcSendBytes(b, new Uint8Array(buf));
        }).catch(function (e) {
          plog('读取导出数据失败: ' + e);
          try { b.finishSave(-1); } catch (e2) { /* ignore */ }
        });
        return true;
      }
      try { b.finishSave(-1); } catch (e) { /* ignore */ }
      return true;
    }

    (function hookAnchorClick() {
      var orig = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function () {
        try {
          var dl = this.getAttribute('download');
          var href = this.href || '';
          if (dl !== null && href.indexOf('blob:') === 0) {
            var blob = pcBlobs[href] || null;
            if (pcHostSave(dl, blob, href)) { return; }
          }
        } catch (e) {
          plog('拦截下载失败: ' + e);
        }
        return orig.apply(this, arguments);
      };
    })();

    // ------------------------------------------------------------------
    // 外部链接
    //
    // 引擎里的「在 GitHub 上查看」这类外链，在 Web 里是 window.open / <a target=_blank>。
    // 在 Web 组件内打开会把编辑器页面整个顶掉，而引擎没有返回键 —— 只能杀掉应用重开。
    // 这里全部拦下来交给系统浏览器，编辑器页面保持不动。
    // ------------------------------------------------------------------

    function pcOpenExternal(url) {
      var u = String(url || '');
      if (!u) { return false; }
      plog('外部链接交给系统浏览器: ' + u);
      try {
        var b = bridge();
        if (b && typeof b.openUrl === 'function' && b.openUrl(u) === true) { return true; }
      } catch (e) {
        plog('openUrl 失败: ' + e);
      }
      // 宿主没接住也绝不让它把编辑器顶掉：宁可什么都不发生。
      return true;
    }

    (function hookWindowOpen() {
      var orig = window.open;
      window.open = function (url, target, features) {
        var u = String((url === null || url === undefined) ? '' : url);
        if (!u) { return null; }
        pcOpenExternal(u);
        return null;
      };
    })();

    document.addEventListener('click', function (e) {
      try {
        var t = e.target;
        while (t && t !== document && (!t.tagName || t.tagName !== 'A')) {
          t = t.parentElement || t.parentNode;
        }
        if (!t || !t.tagName || t.tagName !== 'A') { return; }
        if (t.hasAttribute('download')) { return; }
        var abs = t.href || '';
        // 只拦真正会跳出编辑器的 http(s) 链接，同页面锚点/相对路径/其它协议一律放行
        if (!/^https?:/i.test(abs)) { return; }
        e.preventDefault();
        e.stopPropagation();
        pcOpenExternal(abs);
      } catch (err) { /* ignore */ }
    }, true);

    function setProgress(ratio, text) {
      if (typeof ratio === 'number' && isFinite(ratio)) {
        var p = Math.max(0, Math.min(1, ratio));
        barFill.style.width = (p * 100).toFixed(1) + '%';
      }
      if (text) { splashText.textContent = text; }
    }

    // 渲染后端：鸿蒙侧注入 > URL 参数 > 自动
    function resolveRenderMode() {
      try {
        var b = bridge();
        if (b && typeof b.renderMode === 'function') {
          var m = b.renderMode();
          if (m) { return String(m); }
        }
      } catch (e) { /* ignore */ }
      try {
        var q = new URLSearchParams(location.search).get('mode');
        if (q) { return q; }
      } catch (e) { /* ignore */ }
      return 'auto';
    }

    var renderMode = resolveRenderMode();
    window.__PC_RENDER_MODE = renderMode;
    // PhotoCraft 通过查询串选择后端；同时提供全局变量供宿主读取
    if (renderMode && renderMode !== 'auto') {
      var flag = renderMode === 'webgl' ? 'webgl' : (renderMode === 'cpu' ? 'cpu' : '');
      if (flag) {
        try {
          var usp = new URLSearchParams(location.search);
          if (!usp.has(flag)) { usp.set(flag, '1'); window.__PC_FORCED = flag; }
        } catch (e) { /* ignore */ }
      }
    }

    function fail(message, err) {
      var detail = '';
      if (err) {
        detail = (err && err.stack) ? String(err.stack) : String(err);
      }
      report('error', message + (detail ? ' | ' + detail : ''));
      splash.classList.add('pc-hidden');
      errMsg.textContent = message;
      errDetail.textContent = detail || '（无详细信息）';
      errBox.classList.add('pc-show');
      console.error('[PhotoCraft] ' + message, err);
    }

    function fetchBytes(url, onProgress) {
      return fetch(url).then(function (res) {
        if (!res.ok) { throw new Error('HTTP ' + res.status + ' for ' + url); }
        var total = Number(res.headers.get('content-length') || 0);
        if (!res.body || typeof res.body.getReader !== 'function') {
          return res.arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
        }
        var reader = res.body.getReader();
        var parts = [];
        var got = 0;
        return (function pump() {
          return reader.read().then(function (r) {
            if (r.done) {
              var out = new Uint8Array(got);
              var off = 0;
              for (var i = 0; i < parts.length; i++) { out.set(parts[i], off); off += parts[i].length; }
              return out;
            }
            parts.push(r.value);
            got += r.value.length;
            if (onProgress) { onProgress(total ? got / total : 0, got); }
            return pump();
          });
        })();
      });
    }

    function xhrBytes(url) {
      return new Promise(function (resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'arraybuffer';
        xhr.onload = function () {
          if (xhr.status === 0 || (xhr.status >= 200 && xhr.status < 300)) {
            if (!xhr.response) { reject(new Error('empty response')); return; }
            resolve(new Uint8Array(xhr.response));
          } else {
            reject(new Error('XHR status ' + xhr.status));
          }
        };
        xhr.onerror = function () { reject(new Error('XHR network error')); };
        xhr.send();
      });
    }

    // 通过鸿蒙原桥分块读取 rawfile（前两条路径都不可用时的兜底）
    function bridgeBytes(url, onProgress) {
      var b = bridge();
      if (!b || typeof b.assetSize !== 'function' || typeof b.assetChunk !== 'function') {
        return Promise.reject(new Error('原生资源通道不可用'));
      }
      var size = Number(b.assetSize(url));
      if (!size || size <= 0) {
        return Promise.reject(new Error('未找到资源: ' + url));
      }
      var out = new Uint8Array(size);
      var offset = 0;
      return new Promise(function (resolve, reject) {
        (function step() {
          try {
            var guard = 0;
            while (offset < size && guard < 64) {
              var len = Math.min(CHUNK_SIZE, size - offset);
              var b64 = b.assetChunk(url, offset, len);
              if (!b64) { throw new Error('分块读取返回空'); }
              var bin = atob(b64);
              for (var i = 0; i < bin.length; i++) { out[offset + i] = bin.charCodeAt(i); }
              offset += bin.length;
              guard++;
            }
            if (onProgress) { onProgress(offset / size, offset); }
            if (offset < size) { setTimeout(step, 0); return; }
            resolve(out);
          } catch (e) {
            reject(e);
          }
        })();
      });
    }

    function loadBytes(url, onProgress) {
      return fetchBytes(url, onProgress).catch(function (e) {
        plog('fetch 失败(' + e + ')，尝试 XHR: ' + url);
        return xhrBytes(url);
      }).catch(function (e) {
        plog('XHR 失败(' + e + ')，尝试原生资源通道: ' + url);
        return bridgeBytes(url, onProgress);
      });
    }

    function textFromBytes(bytes) {
      try {
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        var s = '';
        for (var i = 0; i < bytes.length; i += 8192) {
          s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, bytes.length)));
        }
        return s;
      }
    }

    // 读取文本资源：fetch 直接取文本 → 否则走字节通道再解码
    function loadText(url) {
      return fetch(url).then(function (res) {
        if (!res.ok) { throw new Error('HTTP ' + res.status + ' for ' + url); }
        return res.text();
      }).catch(function (e) {
        plog('fetch 文本失败(' + e + ')，改用字节通道: ' + url);
        return loadBytes(url).then(textFromBytes);
      });
    }

    // 以经典脚本方式注入：不经过 ES Module 加载器，因此不受 resource:// 协议限制
    function injectClassicScript(text) {
      var el = document.createElement('script');
      el.type = 'text/javascript';
      el.textContent = text;
      (document.head || document.documentElement).appendChild(el);
      try { el.parentNode.removeChild(el); } catch (e) { /* ignore */ }
      return window.__PhotoCraftModule || null;
    }

    // 加载引擎模块：经典脚本通道优先，失败再回退到上游 ESM
    function loadEngineModule() {
      report('loading', 'js');
      return loadText(JS_CLASSIC_URL).then(function (text) {
        var mod = injectClassicScript(text);
        if (!mod || typeof mod.default !== 'function') {
          throw new Error('经典脚本注入后未导出初始化函数');
        }
        plog('引擎胶水层：经典脚本通道 OK（' + text.length + ' 字符）');
        return mod;
      }).catch(function (e) {
        plog('经典脚本通道失败(' + e + ')，回退上游 ESM');
        return import(JS_MODULE_URL).then(function (mod) {
          plog('引擎胶水层：ESM 通道 OK');
          return mod;
        });
      });
    }

    // 引擎在 Rust/wgpu 内部按 navigator.gpu 是否存在来选择后端（WebGPU → WebGL2）。
    // 选「WebGL2」时主动把 navigator.gpu 藏掉，是让该选项真正生效的唯一办法。
    function applyRenderModeHint() {
      var hasGpu = (typeof navigator !== 'undefined' && typeof navigator.gpu !== 'undefined' && navigator.gpu !== null);
      if (renderMode === 'webgl') {
        try {
          Object.defineProperty(navigator, 'gpu', { value: undefined, configurable: true });
          plog('已屏蔽 navigator.gpu，强制引擎使用 WebGL2 后端');
        } catch (e) {
          plog('屏蔽 navigator.gpu 失败: ' + e);
        }
      } else {
        plog('渲染后端 hint=' + renderMode + '，navigator.gpu 可用=' + hasGpu);
      }
    }

    function start() {
      setProgress(0.02, '正在加载编辑引擎…');
      plog('engine boot, renderMode=' + renderMode + ', ua=' + navigator.userAgent);
      applyRenderModeHint();
      loadEngineModule().then(function (mod) {
        setProgress(0.16, '正在读取图像引擎（约 24.5 MB）…');
        report('loading', 'wasm');
        return loadBytes(WASM_URL, function (p, got) {
          setProgress(0.16 + p * 0.68, '正在读取图像引擎 ' + (got / 1048576).toFixed(1) + ' MB');
        }).then(function (bytes) {
          plog('wasm 已读取 ' + bytes.length + ' 字节，开始编译');
          setProgress(0.88, '正在编译并初始化…');
          report('loading', 'compile');
          // 直接把字节交给胶水层，避免它自己去 fetch resource:// 下的 wasm
          return mod.default({ module_or_path: bytes }).then(function (wasm) {
            window.wasmBindings = mod;
            try {
              dispatchEvent(new CustomEvent('TrunkApplicationStarted', { detail: { wasm: wasm } }));
            } catch (e) { /* ignore */ }
            setProgress(1, '就绪');
            splash.classList.add('pc-hidden');
            plog('引擎初始化完成');
            report('ready', renderMode);
            setTimeout(function () {
              var c = document.getElementById('photocraft_canvas');
              if (c && typeof c.focus === 'function') { try { c.focus(); } catch (e) { /* ignore */ } }
            }, 240);
          });
        });
      }).catch(function (e) {
        fail('编辑引擎未能初始化：' + ((e && e.message) ? e.message : e), e);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
  </script>
</body>
</html>
